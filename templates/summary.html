<!DOCTYPE html>
<html>
<head>
  <title>Expense Summary</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="header">
    <h1>Smart Expense Tracker</h1>
</div>

<h1>Expense Summary</h1>

<form method="GET" action="/summary" class="summary-filter">

    <select name="year">
        <option value="">All Years</option>
        {% for y in years %}
            <option value="{{ y }}"
            {% if y|string == selected_year %}
                selected
            {% endif %}>
                {{ y }}
            </option>
        {% endfor %}
    </select>

    <select name="month">

    <option value="">All Months</option>

    <option value="1">January</option>
    <option value="2">February</option>
    <option value="3">March</option>
    <option value="4">April</option>
    <option value="5">May</option>
    <option value="6">June</option>
    <option value="7">July</option>
    <option value="8">August</option>
    <option value="9">September</option>
    <option value="10">October</option>
    <option value="11">November</option>
    <option value="12">December</option>

</select>

    <button type="submit">Show</button>

</form>

<br>
<div class="summary-container">
    <div class="summary-card">
        <h3>Total Expense</h3>
        <p>₹ {{ total_expense }}</p>
    </div>

    <div class="summary-card">
        <h3>Top Category</h3>
        <p>{{ category }}</p>
    </div>

    <div class="summary-card">
     <h3>Average Transaction</h3>
     <p>₹ {{ average_transaction }}</p>
    </div>
</div>


<div class="chart-card">

{% if no_data %}
    <h3>No expenses found for the selected period.</h3>
{% else %}
    <img src="{{ url_for('static', filename='chart.png') }}"
         alt="Expense Chart">
{% endif %}

</div>
<br><br>

    <a href="/">
    <button>Back to Home</button>
    </a>

<footer>
    Smart Expense Tracker © 2026
</footer>
</body>
</html>
