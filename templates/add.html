<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense — Smart Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="header">
        <h1>Smart Expense Tracker</h1>
    </div>

    <div class="page-title">
        <h2>Add Expense</h2>
        <p class="page-subtitle">Enter the details below</p>
    </div>

    <div class="add-card">
        <form class="add-form" method="POST" action="/add_expense">

            <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <input type="number" step="0.01" name="amount" id="amount" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <div class="select-wrapper">
                    <select name="category" id="category" onchange="toggleCategory()">
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-group" id="customCategoryDiv" style="display:none;">
                <label for="custom_category">Custom Category</label>
                <input type="text" name="custom_category" id="custom_category" placeholder="e.g. Rent, Gym">
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="text" name="date" id="date" placeholder="Select Date..." required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" name="description" id="description" placeholder="Optional note">
            </div>

            <button type="submit">Add Expense</button>

        </form>
    </div>

    <div class="nav-bottom">
        <a href="/">
            <button class="btn-outline">&larr; Back</button>
        </a>
    </div>

    <footer>Smart Expense Tracker &copy; 2026</footer>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
function toggleCategory() {
    const v = document.getElementById("category").value;
    document.getElementById("customCategoryDiv").style.display = v === "Other" ? "block" : "none";
}
document.addEventListener('DOMContentLoaded', function() {
    flatpickr("#date", {
        defaultDate: "today",
        dateFormat: "Y-m-d"
    });
});
</script>

</body>
</html>
