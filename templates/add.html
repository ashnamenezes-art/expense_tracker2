<!DOCTYPE html>
<html>
<head>
    <title>Add Expense</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="header">
    <h1>Smart Expense Tracker</h1>
    </div>

    <h2>Add Expense</h2>
    <div class="add-card">
    <form class="add-form" method="POST" action="/add_expense">

        <label>Amount:</label>
        <input type="text" name="amount" required>
        <br><br>

        <label>Category:</label>
        <select name="category" id="category" onchange="toggleCategory()">
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
        <option value="Other">Other</option>
        </select>
        <br><br>

        <div id="customCategoryDiv" style="display:none;">
        <label>Enter Category:</label>
        <input type="text" name="custom_category">
        </div>

        <br><br>
        
        <label>Date:</label>
        <input type="date" name="date" required>
        <br><br>

        <label>Description:</label>
        <input type="text" name="description">
        <br><br>

        <button type="submit">Add Expense</button>

    </form>
    </div>
    <br>
    <a href="/">
      <button>Back to Home</button>
    </a>
<script>
function toggleCategory() {
    let category = document.getElementById("category").value;
    let customDiv = document.getElementById("customCategoryDiv");

    if (category === "Other") {
        customDiv.style.display = "block";
    } else {
        customDiv.style.display = "none";
    }
}
</script>
<footer>
    Smart Expense Tracker © 2026
</footer>
</body>
</html>
